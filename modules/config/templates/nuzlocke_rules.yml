# Enabled Nuzlocke rules for campaign runs. Leave this list empty for an
# unrestricted campaign; existing behavior is preserved by the default below.
enabled_rules:
  - one_encounter_per_area
  - fainting
  - species_clause
  - level_cap
  # Remove this rule when a whiteout should return the player to the last
  # healing location without ending the campaign run.
  - whiteout_failure
  # Optional: answer trainer replacement prompts strategically.
  # - set_battle_style

# Restock only when the bag drops below the lower threshold, then buy back up
# to the upper target.  This avoids abandoning route progress after every
# individual Poké Ball use.
pokeball_lower_threshold: 5
pokeball_upper_target: 10

# Species Clause re-rolls. With the species_clause rule enabled, an encounter of
# a species you already own is skipped and does not use up the area's encounter.
# Leave this null for no limit. A number caps how many duplicates may be skipped
# in one area; after that the next encounter in the area counts even if it is a
# duplicate.
species_clause_max_duplicates_per_area: null
