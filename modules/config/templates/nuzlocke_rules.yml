# Enabled Nuzlocke rules for campaign runs. Leave this list empty for an
# unrestricted campaign; existing behavior is preserved by the default below.
enabled_rules:
  - one_encounter_per_area
  - fainting
  - species_clause
  - level_cap
  # Optional: answer trainer replacement prompts strategically.
  # - set_battle_style

# Restock only when the bag drops below the lower threshold, then buy back up
# to the upper target.  This avoids abandoning route progress after every
# individual Poké Ball use.
pokeball_lower_threshold: 5
pokeball_upper_target: 10
