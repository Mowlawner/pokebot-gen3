name: Pytest compatibility collection

on: [push, pull_request]

jobs:
  pytest-collection:
    name: Collect unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt $(python -c "from requirements import required_modules; print(' '.join(required_modules))")

      - name: Collect the unit tier
        run: python -m pytest --collect-only -q -m unit
